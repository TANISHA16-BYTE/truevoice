name: Backend CI

on:
  push:
    branches:
      - main
      - migration/postgresql-supabase
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Syntax, integration and benchmark tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check server.js

      - name: Run integration tests
        run: npm test

      - name: Run fixed benchmark
        run: npm run benchmark

  postgres-smoke:
    name: Isolated PostgreSQL schema and adapter smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: truevoice_test
          POSTGRES_PASSWORD: truevoice_test_password
          POSTGRES_DB: truevoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truevoice_test -d truevoice_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://truevoice_test:truevoice_test_password@localhost:5432/truevoice_test
      DATABASE_SSL: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply schema to disposable CI database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/supabase_migration.sql

      - name: Verify PostgreSQL adapter and schema
        run: node tests/postgres-smoke.test.js
